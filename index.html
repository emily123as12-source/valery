<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valery</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .cuadro {
            border: 2px solid white;
            border-radius: 10px;
            padding: 40px 80px;
            position: absolute;
            background-color: black;
            min-width: 250px;
            text-align: center;
            transition: all 0.1s ease;
        }
        .boton-cerrar {
            position: absolute;
            top: 15px;
            left: 15px;
            border: 1px solid white;
            border-radius: 5px;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .nombre {
            color: white;
            font-size: 48px;
            font-weight: bold;
            margin: 0;
            margin-top: 10px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="cuadro" id="miCuadro">
        <div class="boton-cerrar" id="btnX">✕</div>
        <p class="nombre">Valery</p>
    </div>

    <script>
        const cuadro = document.getElementById('miCuadro');
        const btnX = document.getElementById('btnX');

        function escapar() {
            const maxW = window.innerWidth - cuadro.offsetWidth;
            const maxH = window.innerHeight - cuadro.offsetHeight;
            const randomX = Math.floor(Math.random() * maxW);
            const randomY = Math.floor(Math.random() * maxH);
            cuadro.style.left = randomX + 'px';
            cuadro.style.top = randomY + 'px';
        }

        btnX.addEventListener('mouseenter', escapar);
        btnX.addEventListener('click', escapar);
    </script>

</body>
</html>
